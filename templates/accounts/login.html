{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingreso | Bemba POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/bemba.css' %}">
</head>
<body class="login-screen">
  <section class="login-panel">
    <div class="brand mb-4">Bemba<span>POS</span></div>
    <h1>Acceso del equipo</h1>
    <p class="text-muted">Operación, caja, cocina e inventario en una sola plataforma.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <label class="form-label">Usuario</label>
      <input class="form-control mb-3" type="text" name="username" required autofocus>
      <label class="form-label">Contraseña</label>
      <input class="form-control mb-3" type="password" name="password" required>
      {% if form.errors %}<div class="alert alert-danger">Credenciales inválidas.</div>{% endif %}
      <button class="btn btn-dark w-100" type="submit">Entrar</button>
    </form>
  </section>
</body>
</html>
